<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNIST Digit Recognizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .prediction-result {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
        }
        .uploaded-image {
            max-width: 150px;
            max-height: 150px;
            margin-top: 15px;
        }
        .main-container {
            max-width: 800px;
        }
    </style>
</head>
<body>
    <div class="container main-container my-5">
        <div class="row">
            <div class="col-12">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h3 class="mb-0">MNIST Digit Recognizer</h3>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <form id="upload-form" enctype="multipart/form-data">
                                    <div class="mb-3">
                                        <label for="image-upload" class="form-label">Select an image of a handwritten digit</label>
                                        <input class="form-control" type="file" id="image-upload" name="file" accept=".png, .jpg, .jpeg">
                                    </div>
                                    <button type="submit" class="btn btn-primary">Tahmin Et</button>
                                </form>
                            </div>
                            <div class="col-md-6 text-center">
                                <div id="result-container">
                                    <img id="preview-image" class="img-fluid uploaded-image d-none" alt="Uploaded image">
                                    <div id="prediction-result" class="prediction-result mt-3">
                                        <!-- Prediction result will be shown here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('upload-form');
            const imageUpload = document.getElementById('image-upload');
            const previewImage = document.getElementById('preview-image');
            const predictionResult = document.getElementById('prediction-result');

            // Image preview
            imageUpload.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    previewImage.src = URL.createObjectURL(file);
                    previewImage.classList.remove('d-none');
                    predictionResult.textContent = '';
                }
            });

            // Form submission
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                const formData = new FormData(form);

                // Show loading state
                predictionResult.textContent = 'Tahmin ediliyor...';

                fetch('/predict', {
                    method: 'POST',
                    body: formData
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        predictionResult.textContent = 'Hata: ' + data.error;
                    } else {
                        predictionResult.textContent = 'Tahmin edilen rakam: ' + data.prediction;
                    }
                })
                .catch(error => {
                    predictionResult.textContent = 'Bir hata oluştu: ' + error.message;
                });
            });
        });
    </script>
</body>
</html>
